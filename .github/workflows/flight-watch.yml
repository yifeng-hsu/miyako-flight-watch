name: Miyako flight watch

on:
  schedule:
    # 01:05 UTC = 09:05 Asia/Taipei
    - cron: "5 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/flight-watch.yml"
      - "tracker.py"
      - "requirements.txt"
      - "docs/index.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: miyako-flight-watch
  cancel-in-progress: false

jobs:
  track-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate Python source
        run: python -m compileall -q tracker.py

      - name: Track current prices
        id: tracker
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_TOTAL_TWD: ${{ vars.TARGET_TOTAL_TWD || '48000' }}
          DROP_ALERT_PERCENT: ${{ vars.DROP_ALERT_PERCENT || '5' }}
          ADULTS: "4"
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "::error title=Missing SERPAPI_KEY::Add SERPAPI_KEY under Settings > Secrets and variables > Actions."
            exit 2
          fi
          python tracker.py

      - name: Commit updated price history
        if: steps.tracker.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json
          if git diff --cached --quiet; then
            echo "Price history is unchanged."
            exit 0
          fi
          git commit -m "chore: update flight prices"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report missing tracker configuration
        if: steps.tracker.outcome == 'failure'
        run: |
          echo "SERPAPI_KEY is missing, so the site was deployed without a new price check."
          exit 1
